<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%PUBLIC_URL%/logo192.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Use your primary brand color (from variables.css) as the theme color -->
    <meta name="theme-color" content="#ae114f" />
    <meta
      name="description"
      content="Hendrix Ventures Group buys houses for cash across metro Atlanta, Georgia. Sell your house as-is — no fees, no commissions, no repairs. Get a free, no-obligation cash offer."
    />
    <link rel="canonical" href="https://hendrixventures.com/" />
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph Meta Tags for social sharing -->
    <meta
      property="og:title"
      content="Hendrix Ventures Group | Sell Your House for Cash in Atlanta"
    />
    <meta
      property="og:description"
      content="We buy Atlanta houses for cash, in any condition. No fees, no commissions, no repairs. Get a free, no-obligation cash offer."
    />
    <meta property="og:image" content="https://hendrixventures.com/og-image.jpg" />
    <meta property="og:url" content="https://hendrixventures.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hendrix Ventures Group" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Hendrix Ventures Group | Sell Your House for Cash in Atlanta"
    />
    <meta
      name="twitter:description"
      content="We buy Atlanta houses for cash, in any condition. No fees, no commissions, no repairs. Get a free, no-obligation cash offer."
    />
    <meta
      name="twitter:image"
      content="https://hendrixventures.com/og-image.jpg"
    />

    <title>Hendrix Ventures Group | Sell Your House for Cash in Atlanta</title>

    <style>
      /* Optional inline styling for a clean, modern look */
      body {
        font-family: "Lato", sans-serif;
        background: #fff;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Hidden registrations for Netlify Forms. Submissions are relayed
         server-side by the lead functions after spam checks; these exist so
         Netlify's build detects the forms and shows entries in the dashboard. -->
    <form name="seller-lead" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <input type="text" name="address" />
    </form>
    <form name="investor-signup" data-netlify="true" hidden>
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="text" name="contact" />
      <input type="email" name="email" />
      <input type="text" name="market" />
      <input type="text" name="buyerType" />
    </form>
  </body>
</html>
